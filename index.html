.back{position:absolute;left:1%;top:1%;width:12%;height:14%;background:none;border:0;cursor:pointer}
.wrap{width:100%;max-width:980px;margin:-10px auto 0;padding:0 16px 24px;flex:1;perspective:1100px}
.panel{border:1.5px solid var(--gold2);border-radius:26px;background:rgba(20,10,36,.82);padding:26px;backdrop-filter:blur(3px);transition:transform .15s;transform-style:preserve-3d;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 40px rgba(232,194,106,.08);animation:rise .9s both}
@keyframes rise{from{opacity:0;transform:translateY(40px) rotateX(18deg)}}
label{display:block;font-weight:600;margin:0 0 8px 6px}
input,select{width:100%;height:54px;border-radius:16px;border:1.5px solid var(--gold2);background:#150a26;color:var(--txt);font:500 16px inherit;padding:0 18px}
input::placeholder{color:#8a7ca3;font-style:italic}
input:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}
@media(max-width:640px){.row{grid-template-columns:1fr}.panel{padding:18px}}
.search{margin-top:24px;width:100%;height:58px;border:0;border-radius:16px;background:linear-gradient(90deg,#9d00ff,#c04dff,#9d00ff);background-size:200%;color:#fff;font:700 22px inherit;cursor:pointer;box-shadow:0 6px 20px rgba(157,0,255,.4);animation:shift 4s linear infinite}
@keyframes shift{to{background-position:200%}}
.search:hover{filter:brightness(1.12);transform:translateY(-2px)}
.err{color:#ff9db0;margin:14px 6px 0;min-height:1.2em;font-size:14px}
#results{margin-top:22px;display:grid;gap:16px;perspective:900px}
.count{color:var(--mut);margin:0 6px}
.card{border:1.5px solid var(--gold2);border-radius:22px;background:linear-gradient(160deg,#241240,#150a26);padding:22px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;animation:flip .7s both;animation-delay:calc(var(--i)*.12s)}
@keyframes flip{from{opacity:0;transform:rotateX(-70deg) translateY(30px)}}
.reg{text-align:center;padding:14px 18px;border-radius:16px;border:1px solid var(--gold);background:rgba(232,194,106,.08)}
.reg small{display:block;color:var(--mut);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.reg b{font-size:30px;letter-spacing:.04em;background:linear-gradient(90deg,#b98a2e,#fff1b8,#b98a2e);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shift 3s linear infinite}
.info h3{margin:0 0 2px;font-size:19px}.info .full{color:var(--mut);margin:0 0 10px;font-size:14px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tag{padding:3px 12px;border-radius:99px;background:rgba(157,0,255,.25);border:1px solid #7a30c4;font-size:13px}
.inst{font-size:14px;color:var(--mut)}
@media(max-width:520px){.card{grid-template-columns:1fr}}
.none{text-align:center;color:var(--mut);padding:18px;border:1px dashed var(--gold2);border-radius:18px}
.good{text-align:center;font:800 clamp(28px,6vw,52px) inherit;margin:30px 0 0;background:linear-gradient(90deg,#b98a2e,#fff1b8,#b98a2e);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shift 3s linear infinite}
footer{flex:none;position:relative;z-index:3;text-align:center;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));font-size:12.5px;line-height:1.6;color:var(--mut);border-top:1px solid rgba(232,194,106,.25);background:#0a0413}
footer a{color:var(--gold);text-decoration:none;font-weight:600}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

function run(){
 const q=norm($('name').value),a=$('age').value,l=$('lang').value,err=$('err'),out=$('results');
 err.textContent='';out.innerHTML='';
 if(q.length<2){err.textContent='Please enter at least 2 letters of your name.';return}
 if(!a||!l){err.textContent='Please select both your age category and language.';return}
 const m=D.filter(x=>x.a===a&&x.l===l&&(norm(x.n).includes(q)||norm(x.f).includes(q)));
 if(!m.length){out.innerHTML='<div class="none">No registration found. Check the spelling, age category and language, or try a shorter part of your name.</div>';return}
 out.innerHTML='<p class="count">'+m.length+' result'+(m.length>1?'s':'')+' found</p>'+m.map((x,i)=>
 `<div class="card" style="--i:${i}"><div class="reg"><small>Registration No</small><b>${esc(x.r)}</b></div><div class="info"><h3>${esc(x.n)}</h3><p class="full">${esc(x.f)}</p><div class="tags"><span class="tag">${esc(x.l)}</span><span class="tag">Age ${esc(x.a)}</span></div><div class="inst">${esc(x.i)}</div></div></div>`).join('');
 out.scrollIntoView({behavior:'smooth',block:'nearest'});
}
$('btn').onclick=run;
['name','age','lang'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key==='Enter')run()}));
// 3D tilt on panel
const panel=$('panel');
panel.addEventListener('mousemove',e=>{const r=panel.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;panel.style.transform=`rotateY(${x*6}deg) rotateX(${-y*5}deg)`});
panel.addEventListener('mouseleave',()=>panel.style.transform='');
</script></body></html>
